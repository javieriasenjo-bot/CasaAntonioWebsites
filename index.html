<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- analytics-bootstrap -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Casa Antonio · Sapporo</title>
    <meta
      name="description"
      content="Two private apartments in one quiet house in Kita-ku, Sapporo. Casa Antonio A and Casa Antonio B, a short walk from Asabu Station."
    />
    <meta name="theme-color" content="#243833" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://casaantonio.jp/" />
    <link
      rel="preload"
      as="image"
      type="image/avif"
      href="/photos/b-living-800.avif"
      imagesrcset="/photos/b-living-800.avif 800w, /photos/b-living-1600.avif 1600w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <meta property="og:title" content="Casa Antonio · Sapporo" />
    <meta
      property="og:description"
      content="Two private apartments in one quiet house in Kita-ku, Sapporo."
    />
    <meta property="og:image" content="https://casaantonio.jp/og.jpg" />
    <meta property="og:url" content="https://casaantonio.jp/" />
    <meta property="og:type" content="website" />
    <script type="module">
      // Dev-server only: production pages are prerendered with the font link
      // already in the markup (see src/lib/seo.ts), so this duplicates that
      // logic just enough to pick the right font before hydration.
      import { FONT_STYLESHEET } from "/src/lib/fonts.ts";
      import { HTML_LANG } from "/src/lib/paths.ts";
      var saved = "en";
      try {
        var stored = localStorage.getItem("casa-antonio-lang");
        if (stored && FONT_STYLESHEET[stored]) saved = stored;
      } catch (e) {}
      document.documentElement.lang = HTML_LANG[saved];
      var link = document.createElement("link");
      link.id = "casa-font";
      link.rel = "stylesheet";
      link.href = FONT_STYLESHEET[saved];
      link.media = "print";
      link.setAttribute("data-lang", saved);
      link.onload = function () { this.media = "all"; };
      document.head.appendChild(link);
    </script>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-T8TLRH4L"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
